name: Build Senerita Eats APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname 'SeneritaEats*.zip' | head -n 1)
          echo "Using ZIP: $ZIP"
          unzip -q "$ZIP" -d extracted

      - name: Find Gradle project
        run: |
          find extracted -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT=$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          DIR=$(dirname "$PROJECT")
          cd "$DIR"

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Senerita-Eats-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
