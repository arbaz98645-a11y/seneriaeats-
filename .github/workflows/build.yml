name: Build Senerita Eats APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show repository files
        run: |
          echo "Repository contents:"
          find . -maxdepth 4 -type f | sort

      - name: Find Gradle wrapper
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew is missing from the repository."
            echo "The Android project files must be uploaded to GitHub."
            exit 1
          fi

          chmod +x "$GRADLEW"

      - name: Build Debug APK
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Senerita-Eats-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
